spring.application.name=smart-invite-v3

##########################################
# Multipart (upload fichiers)
##########################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8010}

# Profile actif par default
spring.profiles.active=prod

#End point
app.env.apiUrl=${API_URL}
app.base.url=${BASE_URL}
app.upload.dir=${UPLOAD_DIR:uploads/cards}

##########################################
# Admin
##########################################
app.admin.email=${ADMIN_EMAIL:williamndongmo899@gmail.com}
app.admin.phone=${ADMIN_PHONE:+237655002318}

##########################################
# Google Cloud
##########################################
app.env.clientId=${GOOGLE_CLIENT_ID}

##########################################
# Firebase
##########################################
app.firebase.storage-bucket=${FIREBASE_BUCKET_NAME}
app.firebase.client-email=${FIREBASE_CLIENT_EMAIL}
app.firebase.client-id=${FIREBASE_CLIENT_ID}
app.firebase.private-key=${FIREBASE_PRIVATE_KEY}

##########################################
# Brevo
##########################################
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-name=${BREVO_APP_NAME}
app.brevo.sender-email=${BREVO_SENDER_EMAIL}

##########################################
# WhatsApp Service
##########################################
app.whatsapp.service-url=${BASE_URL:http://localhost:3001}
app.whatsapp.api-secret=${WHATSAPP_API_SECRET:smart-invite-whatsapp-secret}

##########################################
# JWT
##########################################
app.jwt.secret=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
#Un jour
#app.jwt.access-token-expiration=900000
#15 minutes
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000
app.jwt.reset-password-token-expiration=600000

##########################################
# Swagger / OpenAPI
##########################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
