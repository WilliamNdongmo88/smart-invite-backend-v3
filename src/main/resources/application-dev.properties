# Configuration de la base de donnees PostgreSQL local access

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.sql.init.mode=always
spring.jpa.database=postgresql
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

########################################
# CORS
########################################

app.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203

###################################
# REDIS
###################################

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000
spring.data.redis.connect-timeout=5000
spring.cache.redis.time-to-live=3600000

########################################
# HikariCP
########################################

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

########################################
# WhatsApp Process (dev uniquement)
########################################

# Démarrer automatiquement le service Node.js au lancement du backend
app.whatsapp.auto-start=true
# Chemin relatif depuis le dossier smart-invite-backend/
app.whatsapp.service-dir=./whatsapp-service

# Environnement de travail
app.whatsapp.environnement=${NODE_ENV: development}