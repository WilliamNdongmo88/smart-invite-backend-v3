<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject}">Smart Invite</title>
</head>
<body style="margin:0;padding:0;background-color:#1a1a1a;font-family:'Georgia',serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a1a1a;padding:40px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#111111;border-radius:12px;overflow:hidden;
                          border:1px solid #c9a84c;max-width:600px;width:100%;">

                <!-- HEADER -->
                <tr>
                    <td align="center"
                        style="background:linear-gradient(135deg,#1a1a1a 0%,#2a2a2a 100%);
                               padding:36px 40px 28px;
                               border-bottom:2px solid #c9a84c;">

                        <img th:src="${logoUrl}"
                             alt="Smart Invite"
                             width="140"
                             style="display:block;margin:0 auto 16px;"/>

                        <div style="width:60px;height:1px;background:#c9a84c;margin:0 auto;"></div>
                    </td>
                </tr>

                <!-- BODY -->
                <tr>
                    <td style="padding:40px 48px 32px;">

                        <!-- Titre -->
                        <h1 th:text="${title}"
                            style="color:#c9a84c;font-size:20px;font-weight:normal;
                                   letter-spacing:2px;text-align:center;
                                   margin:0 0 28px;text-transform:uppercase;">
                        </h1>

                        <!-- Salutation -->
                        <p th:if="${userName != null}"
                           style="color:#e8e8e8;font-size:15px;line-height:1.7;margin:0 0 20px;">
                            Cher(e)
                            <span th:text="${userName}"
                                  style="color:#c9a84c;font-weight:bold;"></span>,
                        </p>

                        <!-- Contenu texte -->
                        <div th:utext="${content}"
                             style="color:#cccccc;font-size:15px;line-height:1.8;margin:0 0 32px;">
                        </div>

                        <!-- Bloc OTP -->
                        <div th:if="${otp != null}"
                             style="background:#1e1e1e;border:1px solid #c9a84c;
                                    border-radius:8px;padding:28px;text-align:center;
                                    margin:0 0 32px;">
                            <p style="color:#999;font-size:12px;letter-spacing:2px;
                                      text-transform:uppercase;margin:0 0 14px;">
                                Code de vérification
                            </p>
                            <span th:text="${otp}"
                                  style="color:#c9a84c;font-size:40px;font-weight:bold;
                                         letter-spacing:12px;
                                         font-family:'Courier New',monospace;">
                            </span>
                            <p style="color:#666;font-size:12px;margin:14px 0 0;">
                                Ce code expire dans
                                <strong style="color:#c9a84c;">10 minutes</strong>
                            </p>
                        </div>

                        <!-- Bouton CTA -->
                        <div th:if="${ctaUrl != null}"
                             style="text-align:center;margin:0 0 32px;">
                            <a th:href="${ctaUrl}"
                               style="display:inline-block;
                                      background:linear-gradient(135deg,#c9a84c,#e8c96d);
                                      color:#111111;text-decoration:none;
                                      padding:14px 44px;border-radius:4px;
                                      font-size:13px;font-weight:bold;
                                      letter-spacing:2px;text-transform:uppercase;">
                                <span th:text="${ctaLabel}">Continuer</span>
                            </a>
                            <p style="color:#555;font-size:11px;margin:14px 0 0;">
                                Ou copiez ce lien dans votre navigateur :<br/>
                                <a th:href="${ctaUrl}" th:text="${ctaUrl}"
                                   style="color:#c9a84c;word-break:break-all;font-size:11px;">
                                </a>
                            </p>
                        </div>

                        <!-- Note de sécurité -->
                        <p style="color:#666;font-size:12px;line-height:1.7;
                                  border-top:1px solid #2a2a2a;padding-top:20px;margin:0;">
                            Si vous n'êtes pas à l'origine de cette demande,
                            ignorez simplement cet email.
                        </p>

                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td align="center"
                        style="background:#0d0d0d;padding:24px 40px;
                               border-top:1px solid #2a2a2a;">
                        <p style="color:#c9a84c;font-size:13px;letter-spacing:3px;
                                  text-transform:uppercase;margin:0 0 6px;">
                            Smart Invite
                        </p>
                        <p style="color:#555;font-size:11px;
                                  letter-spacing:1px;margin:0 0 6px;">
                            Wedding Invitation Management
                        </p>
                        <p style="color:#3a3a3a;font-size:10px;margin:0;">
                            © 2026 Smart Invite. Tous droits réservés.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
