########################################
# PostgreSQL
########################################

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.sql.init.mode=always
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

########################################
# CORS
########################################

app.cors.allowed-origins=https://www.smart-invite.com,smart-invite.com,smart-invite-sable.vercel.app

###################################
# REDIS
###################################

spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}
spring.data.redis.timeout=5000
spring.data.redis.connect-timeout=5000
spring.cache.redis.time-to-live=3600000

########################################
# WhatsApp Process
########################################

# En prod, Spring Boot lance Node.js (même conteneur Docker)
app.whatsapp.auto-start=true
app.whatsapp.service-dir=/app/whatsapp-service
# true = pas de display requis (conteneur sans écran)
app.whatsapp.headless=true
