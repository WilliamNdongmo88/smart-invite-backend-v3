# Configuration de la base de donnees PostgreSQL local access

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.sql.init.mode=always
spring.jpa.database=postgresql
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

########################################
# CORS
########################################

app.cors.allowed-origins=https://smart-invite.com

###################################
# REDIS
###################################

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000

########################################
# WhatsApp Process
########################################

# En prod, supervisord gère le démarrage — désactiver ici
app.whatsapp.auto-start=false
# Chemin relatif depuis le dossier smart-invite-backend/
app.whatsapp.service-dir=./whatsapp-service
